<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>神栖市放課後等デイサービス検索｜印刷</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:#202833;
  background:#f4f6f8;
}
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8}
button{font:inherit;cursor:pointer}
.app{width:min(900px,100%);margin:0 auto;padding:16px}
.controls{
  position:sticky;top:0;z-index:20;
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  margin-bottom:12px;padding:10px;
  border:1px solid #d8dde3;border-radius:12px;
  background:rgba(255,255,255,.96);
}
.control-actions{display:flex;gap:8px}
.button{
  min-height:44px;padding:0 14px;border-radius:10px;
  border:1px solid #cbd2da;background:#fff;color:#25303b;font-weight:750
}
.button-primary{border-color:#1f62b8;background:#2b6fc7;color:#fff}
.button:disabled{cursor:wait;opacity:.55}
.status{margin:0;color:#626d78;font-size:.86rem}
.sheet{
  padding:14px;border:1px solid #d8dde3;background:#fff;
}
h1,h2,h3,p{margin-top:0}
h1{margin-bottom:4px;font-size:1.45rem}
.search-label{margin-bottom:12px;font-weight:700}
.map-wrap{
  position:relative;overflow:hidden;
  width:100%;aspect-ratio:6907 / 6095;
  border:1px solid #ccd3da;background:#dfe8f8;
}
.map-stage{position:absolute;inset:0}
.map-stage img,.map-stage canvas{
  position:absolute;inset:0;display:block;
  width:100%;height:100%;user-select:none;-webkit-user-drag:none;
}
.marker-layer{position:absolute;inset:0;pointer-events:none}
.marker{
  position:absolute;transform:translate(-50%,-50%);
  display:grid;place-items:center;line-height:1;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.22));
}
.marker-facility{
  min-width:24px;height:24px;padding:0 5px;
  border:2px solid #fff;border-radius:999px;
  background:#c83e35;color:#fff;font-size:.68rem;font-weight:900;
}
.marker-home{
  width:30px;height:30px;border:3px solid #fff;
  border-radius:50% 50% 50% 0;
  background:#2569c7;color:#fff;font-size:.85rem;
  transform:translate(-50%,-82%) rotate(-45deg);
}
.marker-home>span{transform:rotate(45deg)}
.loading{
  position:absolute;inset:0;display:grid;place-items:center;
  padding:20px;text-align:center;background:#edf0f3;color:#626d78;
}
.loading[hidden]{display:none}
.nearest-title{margin:12px 0 8px;font-size:1.05rem}
.nearest-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;
}
.card{padding:11px;border:1px solid #d8dde3;border-radius:10px;background:#fff}
.rank{
  display:inline-grid;place-items:center;width:28px;height:28px;
  margin-bottom:7px;border-radius:999px;background:#edf3fb;font-weight:850;
}
.card h3{margin-bottom:6px;font-size:.95rem;line-height:1.35}
.card p{margin-bottom:5px;color:#626d78;font-size:.82rem;line-height:1.35}
.card .distance{margin-bottom:0;font-weight:800;color:#202833}
.error{padding:18px;text-align:center;color:#8b2e27}
@media(max-width:720px){
  .nearest-grid{grid-template-columns:1fr}
  .controls{align-items:flex-start;flex-direction:column}
  .control-actions{width:100%}
  .control-actions .button{flex:1}
}
@media print{
  @page{size:A4 portrait;margin:6mm}
  html,body{background:#fff}
  body{font-size:8.5pt}
  .app{width:100%;padding:0}
  .controls{display:none!important}
  .sheet{padding:0;border:0}
  h1{margin-bottom:.8mm;font-size:14pt}
  .search-label{margin-bottom:1.5mm;font-size:8.5pt}
  .map-wrap{width:135mm;max-width:100%;margin:0 auto;aspect-ratio:6907 / 6095;border:1px solid #ccd3da}
  .nearest-title{margin:2mm 0 1mm;font-size:10pt}
  .nearest-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5mm}
  .card{padding:2mm;border-radius:0}
  .rank{width:5.5mm;height:5.5mm;margin-bottom:1mm;font-size:7.5pt}
  .card h3{margin-bottom:.8mm;font-size:8.3pt;line-height:1.25}
  .card p{margin-bottom:.6mm;font-size:7.3pt;line-height:1.25}
  .marker-facility{min-width:20px;height:20px;font-size:.62rem}
  .marker-home{width:26px;height:26px}
}
</style>
</head>
<body>
<main class="app">
  <div class="controls">
    <p id="status" class="status">印刷用のベクター地図を読み込んでいます…</p>
    <div class="control-actions">
      <button id="backButton" class="button" type="button">検索画面に戻る</button>
      <button id="printButton" class="button button-primary" type="button" disabled>印刷</button>
    </div>
  </div>

  <section id="sheet" class="sheet" hidden>
    <h1>神栖市放課後等デイサービス検索</h1>
    <p id="searchLabel" class="search-label"></p>

    <div id="mapWrap" class="map-wrap">
      <div id="mapStage" class="map-stage">
        <img id="mapImage" alt="検索地点と近隣3施設の地図">
        <canvas id="mapCanvas" hidden aria-label="検索地点と近隣3施設の地図"></canvas>
        <div id="facilityMarkerLayer" class="marker-layer"></div>
        <div id="homeMarkerLayer" class="marker-layer"></div>
      </div>
      <div id="loading" class="loading">ベクター地図を読み込んでいます…</div>
    </div>

    <h2 class="nearest-title">近い施設</h2>
    <div id="nearestGrid" class="nearest-grid"></div>
  </section>

  <div id="error" class="error" hidden></div>
</main>

<script>
const PRINT_VECTOR_SOURCE='assets/kamisu-map-print.svg';
const MAP_ASPECT_RATIO=6907/6095;
const IS_PHONE=/iPhone|iPod|Android.*Mobile/i.test(navigator.userAgent);
const USE_RASTER_PRINT=IS_PHONE;
const RASTER_TILES={
  z:4,
  tileSize:512,
  width:8192,
  height:7229,
  url:(x,y)=>`assets/tiles/4/${x}/${y}.webp`
};

const statusEl=document.getElementById('status');
const backButton=document.getElementById('backButton');
const printButton=document.getElementById('printButton');
const sheet=document.getElementById('sheet');
const errorEl=document.getElementById('error');
const searchLabel=document.getElementById('searchLabel');
const mapStage=document.getElementById('mapStage');
const mapImage=document.getElementById('mapImage');
const mapCanvas=document.getElementById('mapCanvas');
const facilityMarkerLayer=document.getElementById('facilityMarkerLayer');
const homeMarkerLayer=document.getElementById('homeMarkerLayer');
const loading=document.getElementById('loading');
const nearestGrid=document.getElementById('nearestGrid');

let selection=null;

function computePrintCrop(selection){
  const points=[selection.point,...selection.nearest.map(f=>({x:f.mapX,y:f.mapY}))];
  const xs=points.map(p=>p.x),ys=points.map(p=>p.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const rawSpan=Math.max(maxX-minX,maxY-minY);
  let span=Math.max(7.5,rawSpan*1.35);
  span=Math.min(55,span);
  let centerX=(minX+maxX)/2,centerY=(minY+maxY)/2;
  let x0=centerX-span/2,y0=centerY-span/2;
  x0=Math.max(0,Math.min(100-span,x0));
  y0=Math.max(0,Math.min(100-span,y0));
  return{x0,y0,span};
}

function createMarker(x,y,type,text,title,offsetPx=0){
  const marker=document.createElement('div');
  marker.className=`marker marker-${type}`;
  marker.style.left=`${x}%`;
  marker.style.top=`${y}%`;
  if(offsetPx) marker.style.marginLeft=`${offsetPx}px`;
  marker.title=title||'';
  if(type==='home'){
    const inner=document.createElement('span');
    inner.textContent='★';
    marker.append(inner);
  }else{
    marker.textContent=text;
  }
  return marker;
}

function renderNearestCards(){
  nearestGrid.replaceChildren();
  selection.nearest.forEach((facility,index)=>{
    const card=document.createElement('article');
    card.className='card';

    const rank=document.createElement('div');
    rank.className='rank';
    rank.textContent=String(index+1);

    const name=document.createElement('h3');
    name.textContent=facility.name;

    const address=document.createElement('p');
    address.textContent=facility.address;

    const phone=document.createElement('p');
    phone.textContent=`電話 ${facility.phone}`;

    const distance=document.createElement('p');
    distance.className='distance';
    distance.textContent=`直線距離 約${Number(facility.distanceKm).toFixed(1)} km`;

    card.append(rank,name,address,phone,distance);
    nearestGrid.append(card);
  });
}

function renderVectorSelection(){
  const crop=computePrintCrop(selection);
  const zoom=100/crop.span;
  mapStage.style.width=`${zoom*100}%`;
  mapStage.style.height=`${zoom*100}%`;
  mapStage.style.left=`${-(crop.x0/crop.span)*100}%`;
  mapStage.style.top=`${-(crop.y0/crop.span)*100}%`;

  mapImage.hidden=false;
  mapCanvas.hidden=true;
  homeMarkerLayer.replaceChildren();
  facilityMarkerLayer.replaceChildren();

  homeMarkerLayer.append(
    createMarker(selection.point.x,selection.point.y,'home','','検索地点')
  );

  const duplicateCounts=new Map();
  selection.nearest.forEach((facility,index)=>{
    const key=`${facility.mapX.toFixed(4)},${facility.mapY.toFixed(4)}`;
    const duplicateIndex=duplicateCounts.get(key)||0;
    duplicateCounts.set(key,duplicateIndex+1);
    const offsets=[0,-26,26,-52,52];
    facilityMarkerLayer.append(
      createMarker(
        facility.mapX,
        facility.mapY,
        'facility',
        String(index+1),
        facility.name,
        offsets[duplicateIndex] ?? duplicateIndex*26
      )
    );
  });
}

function loadTileImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.decoding='async';
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}

async function buildRasterMap(){
  const crop=computePrintCrop(selection);
  const mapW=RASTER_TILES.width;
  const mapH=RASTER_TILES.height;
  const tileSize=RASTER_TILES.tileSize;

  const sx=crop.x0/100*mapW;
  const sy=crop.y0/100*mapH;
  const sw=crop.span/100*mapW;
  const sh=crop.span/100*mapH;

  const outW=1800;
  const outH=Math.round(outW/MAP_ASPECT_RATIO);
  mapCanvas.width=outW;
  mapCanvas.height=outH;

  mapStage.style.inset='0';
  mapStage.style.left='0';
  mapStage.style.top='0';
  mapStage.style.width='100%';
  mapStage.style.height='100%';

  mapImage.hidden=true;
  mapCanvas.hidden=false;
  homeMarkerLayer.replaceChildren();
  facilityMarkerLayer.replaceChildren();

  const ctx=mapCanvas.getContext('2d',{alpha:false});
  ctx.fillStyle='#dfe8f8';
  ctx.fillRect(0,0,outW,outH);

  const x0=Math.max(0,Math.floor(sx/tileSize));
  const x1=Math.min(Math.ceil(mapW/tileSize)-1,Math.floor((sx+sw-1)/tileSize));
  const y0=Math.max(0,Math.floor(sy/tileSize));
  const y1=Math.min(Math.ceil(mapH/tileSize)-1,Math.floor((sy+sh-1)/tileSize));

  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const img=await loadTileImage(RASTER_TILES.url(x,y));
      const sourceX=x*tileSize;
      const sourceY=y*tileSize;
      const sourceW=Math.min(tileSize,mapW-sourceX);
      const sourceH=Math.min(tileSize,mapH-sourceY);
      const dx=(sourceX-sx)/sw*outW;
      const dy=(sourceY-sy)/sh*outH;
      const dw=sourceW/sw*outW;
      const dh=sourceH/sh*outH;
      ctx.drawImage(img,0,0,sourceW,sourceH,dx,dy,dw,dh);
      img.src='';
      await new Promise(resolve=>requestAnimationFrame(resolve));
    }
  }

  const toCanvas=p=>({
    x:(p.x-crop.x0)/crop.span*outW,
    y:(p.y-crop.y0)/crop.span*outH
  });

  const drawCircle=(x,y,r,fill,text)=>{
    ctx.save();
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle='#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x,y,r-5,0,Math.PI*2);
    ctx.fillStyle=fill;
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='700 30px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(text,x,y+1);
    ctx.restore();
  };

  const home=toCanvas(selection.point);
  drawCircle(home.x,home.y,31,'#2569c7','★');

  const duplicateCounts=new Map();
  selection.nearest.forEach((facility,index)=>{
    const key=`${facility.mapX.toFixed(4)},${facility.mapY.toFixed(4)}`;
    const n=duplicateCounts.get(key)||0;
    duplicateCounts.set(key,n+1);
    const p=toCanvas({x:facility.mapX,y:facility.mapY});
    const offsets=[0,-42,42,-84,84];
    drawCircle(p.x+(offsets[n] ?? n*42),p.y,31,'#c83e35',String(index+1));
  });

  loading.hidden=true;
  printButton.disabled=false;
  printButton.textContent='印刷';
  statusEl.textContent='スマホ向け高解像度地図の準備ができました。';
}

function renderSelection(){
  searchLabel.textContent=`検索地点：${selection.label || '指定した位置'}`;
  renderNearestCards();
  sheet.hidden=false;

  if(USE_RASTER_PRINT){
    loading.textContent='スマホ向け高解像度地図を準備しています…';
    statusEl.textContent='スマホ向け高解像度地図を準備しています…';
    buildRasterMap().catch(error=>{
      console.error(error);
      fail('印刷用地図を準備できませんでした。通信環境をご確認ください。');
    });
  }else{
    renderVectorSelection();
    loading.textContent='ベクター地図を読み込んでいます…';
    statusEl.textContent='印刷用のベクター地図を読み込んでいます…';
    requestAnimationFrame(()=>{
      mapImage.src=PRINT_VECTOR_SOURCE;
    });
  }
}

function fail(message){
  loading.hidden=true;
  sheet.hidden=true;
  errorEl.hidden=false;
  errorEl.textContent=message;
  statusEl.textContent=message;
  printButton.disabled=true;
}

try{
  const payload=sessionStorage.getItem('kamisuPrintPayload');
  if(!payload) throw new Error('NO_PRINT_PAYLOAD');
  selection=JSON.parse(payload);
  if(!selection?.point || !Array.isArray(selection?.nearest) || !selection.nearest.length){
    throw new Error('INVALID_PRINT_PAYLOAD');
  }
  renderSelection();
}catch(error){
  fail('印刷データを読み込めませんでした。検索画面に戻って、もう一度印刷を押してください。');
}

mapImage.addEventListener('load',()=>{
  if(USE_RASTER_PRINT) return;
  loading.hidden=true;
  printButton.disabled=false;
  printButton.textContent='印刷';
  statusEl.textContent='印刷用ベクター地図の準備ができました。';
});

mapImage.addEventListener('error',()=>{
  if(USE_RASTER_PRINT) return;
  fail('印刷用のベクター地図を読み込めませんでした。');
});

backButton.addEventListener('click',()=>{
  history.back();
});

printButton.addEventListener('click',()=>{
  if(printButton.disabled) return;
  window.print();
});
</script>
</body>
</html>
