<main class="app">

</div><p class="map-note">印刷時は、指定した位置と近い3施設が見える範囲へ自動調整します。</p></section>

<footer class="footer"><p>掲載施設情報は神栖市「やさしい福祉」掲載データを基に整理した試作です。</p><p>利用者住所は保存しません。</p></footer>
</main>

<script>
const addressForm = document.getElementById("addressForm");
const addressInput = document.getElementById("addressInput");
const statusEl = document.getElementById("status");
const nearestList = document.getElementById("nearestList");
const printButton = document.getElementById("printButton");
const printSearchLabel = document.getElementById("printSearchLabel");
const currentLocationButton = document.getElementById("currentLocationButton");
const placeHomeButton = document.getElementById("placeHomeButton");
const mapViewport = document.getElementById("mapViewport");
const mapStage = document.getElementById("mapStage");
const tileLayer = document.getElementById("tileLayer");
const printMapImage = document.getElementById("printMapImage");
const mapPlaceholder = document.getElementById("mapPlaceholder");
const placementHint = document.getElementById("placementHint");
const facilityMarkerLayer = document.getElementById("facilityMarkerLayer");
const homeMarkerLayer = document.getElementById("homeMarkerLayer");
const zoomInButton = document.getElementById("zoomInButton");
const zoomOutButton = document.getElementById("zoomOutButton");
const resetMapButton = document.getElementById("resetMapButton");
let mapState = { scale: 1, x: 0, y: 0 };
let baseStage = { left: 0, top: 0, width: 0, height: 0 };
let dragState = null, pinchState = null, placementMode = false, pointerMoved = false;
let currentSelection = null;
let printImageReady = false;
let printPreparationToken = 0;
const activePointers = new Map();
function toRadians(v) { return v * Math.PI / 180; }
function haversineDistanceKm(lat1, lon1, lat2, lon2) { const r = 6371.0088; const dLat = toRadians(lat2 - lat1); const dLon = toRadians(lon2 - lon1); const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) * Math.sin(dLon / 2) ** 2; return 2 * r * Math.asin(Math.sqrt(a)); }
function getNearestFacilities(latitude, longitude, limit = 3) { return FACILITIES.map(f => ({ ...f, distanceKm: haversineDistanceKm(latitude, longitude, f.latitude, f.longitude) })).sort((a, b) => a.distanceKm - b.distanceKm).slice(0, limit); }
function renderNearestFacilities(facilities) { nearestList.replaceChildren(); facilities.forEach((facility, index) => { const card=document.createElement('article'); card.className='facility-card'; const rank=document.createElement('div'); rank.className='rank'; rank.textContent=String(index+1); const name=document.createElement('h3'); name.textContent=facility.name; const address=document.createElement('p'); address.textContent=facility.address; const phone=document.createElement('a'); phone.className='phone-link'; phone.href=`tel:${facility.phone.replace(/-/g,'')}`; phone.textContent=`電話 ${facility.phone}`; phone.setAttribute('aria-label',`${facility.name}へ電話 ${facility.phone}`); const distance=document.createElement('p'); distance.className='distance'; distance.textContent=`直線距離 約${facility.distanceKm.toFixed(1)} km`; card.append(rank,name,address,phone,distance); nearestList.append(card); }); }
function latLonToPercent(latitude, longitude) { const c = APP_CONFIG.mapCalibration; return { x: c.x.longitude * longitude + c.x.latitude * latitude + c.x.offset, y: c.y.longitude * longitude + c.y.latitude * latitude + c.y.offset }; }
function percentToLatLon(x, y) { const c = APP_CONFIG.mapCalibration; const a=c.x.longitude,b=c.x.latitude,d=c.y.longitude,e=c.y.latitude; const px=x-c.x.offset, py=y-c.y.offset; const det=a*e-b*d; return { longitude:(px*e-b*py)/det, latitude:(a*py-px*d)/det }; }
function positionMarker(marker) { const x=Number(marker.dataset.mapX), y=Number(marker.dataset.mapY); if(!Number.isFinite(x)||!Number.isFinite(y)||!baseStage.width||!baseStage.height) return; marker.style.left=`${mapState.x + baseStage.width * (x/100) * mapState.scale}px`; marker.style.top=`${mapState.y + baseStage.height * (y/100) * mapState.scale}px`; }
function updateMarkerPositions() { facilityMarkerLayer.querySelectorAll('.marker').forEach(positionMarker); homeMarkerLayer.querySelectorAll('.marker').forEach(positionMarker); }
function markerAtPercent(x, y, type, text, title) { const marker=document.createElement('div'); marker.className=`marker marker-${type}`; marker.dataset.mapX=String(x); marker.dataset.mapY=String(y); marker.style.setProperty('--map-x', `${x}%`); marker.style.setProperty('--map-y', `${y}%`); marker.title=title; if(type==='home'){ const inner=document.createElement('span'); inner.textContent='★'; marker.append(inner); } else { marker.textContent=text; } positionMarker(marker); return marker; }
function renderFacilityMarkers() { facilityMarkerLayer.replaceChildren(); const groups=new Map(); FACILITIES.forEach(f=>{ const key=f.mapGroup||`id-${f.id}`; if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(f); }); groups.forEach(group=>{ const first=group[0]; const text=group.length>1?`${group[0].id}-${group[group.length-1].id}`:String(first.id); const title=group.map(f=>`${f.id}. ${f.name}`).join('\n'); const marker=markerAtPercent(first.mapX, first.mapY, 'facility', text, title); marker.dataset.facilityIds=group.map(f=>f.id).join(','); facilityMarkerLayer.append(marker); }); }
function renderHomeMarker(x,y) { homeMarkerLayer.replaceChildren(); homeMarkerLayer.append(markerAtPercent(x,y,'home','', '自宅（仮位置）')); }
function layoutMapStage() { const vw=mapViewport.clientWidth, vh=mapViewport.clientHeight; if(!vw||!vh) return; const ratio=APP_CONFIG.mapAspectRatio; let width,height; if(vw/vh > ratio){ height=vh; width=height*ratio; } else { width=vw; height=width/ratio; } baseStage={left:(vw-width)/2, top:(vh-height)/2, width, height}; mapStage.style.left=`${baseStage.left}px`; mapStage.style.top=`${baseStage.top}px`; mapStage.style.width=`${width}px`; mapStage.style.height=`${height}px`; applyMapTransform(); }
function chooseZoom() { const dpr=Math.min(3,Math.max(1,window.devicePixelRatio||1)); const requiredWidth=baseStage.width*mapState.scale*dpr; let z=0; while(z<APP_CONFIG.tiles.maxZoom && APP_CONFIG.tiles.widths[z]<requiredWidth) z++; return z; }
const activeTileElements = new Map();
let tileRenderFrame = 0;
function renderTiles() { const z=chooseZoom(); const tileSize=APP_CONFIG.tiles.tileSize; const mapW=APP_CONFIG.tiles.widths[z], mapH=APP_CONFIG.tiles.heights[z]; const cols=Math.ceil(mapW/tileSize), rows=Math.ceil(mapH/tileSize); const scaleX=(baseStage.width/mapW)*mapState.scale, scaleY=(baseStage.height/mapH)*mapState.scale; const wanted=new Set(); for(let x=0;x<cols;x++){ for(let y=0;y<rows;y++){ const sourceX=x*tileSize, sourceY=y*tileSize; const sourceW=Math.min(tileSize,mapW-sourceX), sourceH=Math.min(tileSize,mapH-sourceY); const left=sourceX*scaleX+mapState.x, top=sourceY*scaleY+mapState.y; const width=sourceW*scaleX, height=sourceH*scaleY; const right=left+width, bottom=top+height; if(right < -64 || bottom < -64 || left > baseStage.width + 64 || top > baseStage.height + 64) continue; const key=`${z}/${x}/${y}`; wanted.add(key); let img=activeTileElements.get(key); if(!img){ img=document.createElement('img'); img.className='tile'; img.loading='eager'; img.decoding='async'; img.alt=''; img.src=APP_CONFIG.tiles.url(z,x,y); img.dataset.tileKey=key; activeTileElements.set(key,img); tileLayer.append(img); } img.style.left=`${left}px`; img.style.top=`${top}px`; img.style.width=`${width}px`; img.style.height=`${height}px`; }} for(const [key,img] of activeTileElements){ if(!wanted.has(key)){ img.remove(); activeTileElements.delete(key); }} mapPlaceholder.hidden = activeTileElements.size > 0; }
function scheduleTileRender() { if(tileRenderFrame) return; tileRenderFrame=requestAnimationFrame(()=>{ tileRenderFrame=0; renderTiles(); }); }
function applyMapTransform() { updateMarkerPositions(); scheduleTileRender(); }
function resetMap() { mapState={scale:1,x:0,y:0}; applyMapTransform(); }
function changeZoom(factor, centerX = mapViewport.clientWidth / 2, centerY = mapViewport.clientHeight / 2) { const oldScale=mapState.scale; const nextScale=Math.min(6,Math.max(1,oldScale*factor)); if(nextScale===oldScale) return; const stageCenterX = centerX - baseStage.left; const stageCenterY = centerY - baseStage.top; const ratio = nextScale / oldScale; mapState.x = stageCenterX - (stageCenterX - mapState.x) * ratio; mapState.y = stageCenterY - (stageCenterY - mapState.y) * ratio; mapState.scale = nextScale; applyMapTransform(); }
function focusOnPoints(points) { if(!points.length) return; const xs=points.map(p=>p.x), ys=points.map(p=>p.y); const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys); const spanX=Math.max(10,maxX-minX), spanY=Math.max(10,maxY-minY); const targetWidth=baseStage.width*(spanX/100), targetHeight=baseStage.height*(spanY/100); const scale=Math.min(4.5,Math.max(1.15,Math.min(mapViewport.clientWidth*.7/targetWidth,mapViewport.clientHeight*.7/targetHeight))); const centerX=baseStage.width*((minX+maxX)/200), centerY=baseStage.height*((minY+maxY)/200); mapState.scale=scale; mapState.x = mapViewport.clientWidth/2 - baseStage.left - centerX*scale; mapState.y = mapViewport.clientHeight/2 - baseStage.top - centerY*scale; applyMapTransform(); }
function screenToMapPercent(clientX, clientY) { const rect=mapViewport.getBoundingClientRect(); const sx=clientX-rect.left, sy=clientY-rect.top; const localX=(sx-baseStage.left-mapState.x)/mapState.scale; const localY=(sy-baseStage.top-mapState.y)/mapState.scale; return {x: localX/baseStage.width*100, y: localY/baseStage.height*100}; }
function loadImage(src) { return new Promise((resolve,reject)=>{ const img=new Image(); img.decoding='async'; img.onload=()=>resolve(img); img.onerror=reject; img.src=src; }); }
function computePrintCrop(selection) { const points=[selection.point,...selection.nearest.map(f=>({x:f.mapX,y:f.mapY}))]; const xs=points.map(p=>p.x), ys=points.map(p=>p.y); const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys); const rawSpan=Math.max(maxX-minX,maxY-minY); let span=Math.max(7.5,rawSpan*1.35); span=Math.min(55,span); let centerX=(minX+maxX)/2, centerY=(minY+maxY)/2; let x0=centerX-span/2, y0=centerY-span/2; x0=Math.max(0,Math.min(100-span,x0)); y0=Math.max(0,Math.min(100-span,y0)); return {x0,y0,span}; }
async function buildPrintMap(selection, token) {
  const z=APP_CONFIG.tiles.maxZoom, tileSize=APP_CONFIG.tiles.tileSize;
  const mapW=APP_CONFIG.tiles.widths[z], mapH=APP_CONFIG.tiles.heights[z];
  const crop=computePrintCrop(selection);
  const sx=crop.x0/100*mapW, sy=crop.y0/100*mapH;
  const sw=crop.span/100*mapW, sh=crop.span/100*mapH;
  const outW=1800, outH=Math.round(outW/APP_CONFIG.mapAspectRatio);
  const canvas=document.createElement('canvas'); canvas.width=outW; canvas.height=outH;
  const ctx=canvas.getContext('2d',{alpha:false}); ctx.fillStyle='#dfe8f8'; ctx.fillRect(0,0,outW,outH);
  const x0=Math.max(0,Math.floor(sx/tileSize)), x1=Math.min(Math.ceil(mapW/tileSize)-1,Math.floor((sx+sw-1)/tileSize));
  const y0=Math.max(0,Math.floor(sy/tileSize)), y1=Math.min(Math.ceil(mapH/tileSize)-1,Math.floor((sy+sh-1)/tileSize));
  const jobs=[];
  for(let x=x0;x<=x1;x++){ for(let y=y0;y<=y1;y++){ jobs.push(loadImage(APP_CONFIG.tiles.url(z,x,y)).then(img=>({x,y,img}))); }}
  const tiles=await Promise.all(jobs);
  if(token!==printPreparationToken) return;
  for(const {x,y,img} of tiles){ const sourceX=x*tileSize, sourceY=y*tileSize; const sourceW=Math.min(tileSize,mapW-sourceX), sourceH=Math.min(tileSize,mapH-sourceY); const dx=(sourceX-sx)/sw*outW, dy=(sourceY-sy)/sh*outH; const dw=sourceW/sw*outW, dh=sourceH/sh*outH; ctx.drawImage(img,0,0,sourceW,sourceH,dx,dy,dw,dh); }
  const toCanvas=p=>({x:(p.x-crop.x0)/crop.span*outW,y:(p.y-crop.y0)/crop.span*outH});
  const drawCircle=(x,y,r,fill,text)=>{ ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.beginPath(); ctx.arc(x,y,r-5,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); ctx.fillStyle='#fff'; ctx.font='700 30px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,x,y+1); ctx.restore(); };
  const hp=toCanvas(selection.point); drawCircle(hp.x,hp.y,31,'#2569c7','★');
  const duplicateCounts=new Map();
  selection.nearest.forEach((f,index)=>{ const key=`${f.mapX.toFixed(4)},${f.mapY.toFixed(4)}`; const n=duplicateCounts.get(key)||0; duplicateCounts.set(key,n+1); const p=toCanvas({x:f.mapX,y:f.mapY}); const offset=(n%3-1)*42; drawCircle(p.x+offset,p.y,31,'#c83e35',String(index+1)); });
  printMapImage.src=canvas.toDataURL('image/png');
  printImageReady=true;
  printButton.disabled=false;
  printButton.textContent='印刷';
  if(statusEl.textContent==='印刷用地図を準備しています…') statusEl.textContent='印刷の準備ができました。';
}
function setCurrentSelection(point, nearest, label) {
  currentSelection={point:{x:point.x,y:point.y},nearest:[...nearest],label};
  printSearchLabel.textContent=`検索地点：${label}`;
  printImageReady=false;
  printButton.disabled=true;
  printButton.textContent='印刷準備中';
  statusEl.textContent='印刷用地図を準備しています…';
  const token=++printPreparationToken;
  buildPrintMap(currentSelection,token).catch(error=>{ if(token!==printPreparationToken) return; console.error(error); printButton.disabled=false; printButton.textContent='印刷'; statusEl.textContent='印刷用地図の準備に失敗しました。通信環境をご確認ください。'; });
}
function setHomeFromMap(clientX, clientY) { const point=screenToMapPercent(clientX,clientY); if(point.x<0||point.x>100||point.y<0||point.y>100){ statusEl.textContent='地図の範囲内をタップしてください。'; return; } const {latitude,longitude} = percentToLatLon(point.x, point.y); const nearest=getNearestFacilities(latitude, longitude, 3); renderHomeMarker(point.x, point.y); renderNearestFacilities(nearest); setCurrentSelection(point,nearest,'地図上で指定した位置'); focusOnPoints([point, ...nearest.map(f=>({x:f.mapX,y:f.mapY}))]); placementMode=false; mapViewport.classList.remove('placement-mode'); placementHint.hidden=true; placeHomeButton.textContent='地図上で仮位置を指定'; statusEl.textContent='仮位置から最寄り3施設を表示しました。距離は試作座標による概算です。'; }
function normalizeAddressQuery(address) { const value=address.normalize('NFKC').replace(/\s+/g,'').trim(); if(!value) return ''; if(value.includes('神栖市')) return value.startsWith('茨城県') ? value : `茨城県${value}`; if(value.startsWith('茨城県')) return value; return `${APP_CONFIG.geocoder.defaultPrefix || ''}${value}`; }
function isInsideConfiguredSearchArea(latitude, longitude) { const area=APP_CONFIG.geocoder.searchArea; if(!area) return true; return latitude>=area.south && latitude<=area.north && longitude>=area.west && longitude<=area.east; }
async function geocodeAddress(address) {
  if(APP_CONFIG.geocoder.provider!=='gsi' || !APP_CONFIG.geocoder.endpoint) throw new Error('GEOCODER_NOT_CONFIGURED');
  const query=normalizeAddressQuery(address); if(!query) throw new Error('GEOCODER_EMPTY_QUERY');
  const url=new URL(APP_CONFIG.geocoder.endpoint); url.searchParams.set('q',query); url.searchParams.set('lang','ja'); url.searchParams.set('zl','T'); url.searchParams.set('ilvl','T'); url.searchParams.set('sort_il','1');
  const response=await fetch(url.toString(), {headers:{'Accept':'application/json'}, cache:'no-store'}); if(!response.ok) throw new Error('GEOCODER_REQUEST_FAILED');
  const results=await response.json(); if(!Array.isArray(results) || results.length===0) throw new Error('GEOCODER_NO_RESULTS');
  const candidates=results.map(item=>{ const coordinates=item?.geometry?.coordinates; const longitude=Number(coordinates?.[0]); const latitude=Number(coordinates?.[1]); if(!Number.isFinite(latitude)||!Number.isFinite(longitude)) return null; return {latitude, longitude, matchedAddress:item?.properties?.title || query}; }).filter(Boolean);
  const localCandidate=candidates.find(candidate=>isInsideConfiguredSearchArea(candidate.latitude,candidate.longitude)); if(!localCandidate) throw new Error('GEOCODER_OUTSIDE_AREA');
  return localCandidate;
}
addressForm.addEventListener('submit', async event => { event.preventDefault(); const address=addressInput.value.trim(); if(!address){ statusEl.textContent='住所を入力するか、地図上で仮位置を指定してください。'; return; } try { const {latitude,longitude,matchedAddress} = await geocodeAddress(address); const point = latLonToPercent(latitude, longitude); const nearest=getNearestFacilities(latitude, longitude, 3); renderHomeMarker(point.x, point.y); renderNearestFacilities(nearest); setCurrentSelection(point,nearest,address); focusOnPoints([point, ...nearest.map(f=>({x:f.mapX,y:f.mapY}))]); statusEl.textContent=`「${matchedAddress}」付近から近い3施設を表示しました。`; } catch(error){ if(error.message==='GEOCODER_NOT_CONFIGURED'){ statusEl.textContent='住所検索サービスが設定されていません。'; return; } if(error.message==='GEOCODER_NO_RESULTS'){ statusEl.textContent='住所を特定できませんでした。町名・番地を含めて入力してください。'; return; } if(error.message==='GEOCODER_OUTSIDE_AREA'){ statusEl.textContent='神栖市周辺の住所として確認できませんでした。入力内容をご確認ください。'; return; } console.error(error); statusEl.textContent='住所検索サービスへ接続できませんでした。時間をおいて再度お試しください。'; } });

currentLocationButton.addEventListener('click', () => {
  if (!navigator.geolocation) {
    statusEl.textContent = 'この端末またはブラウザでは現在地を取得できません。';
    return;
  }

  currentLocationButton.disabled = true;
  statusEl.textContent = '現在地を取得しています…';

  navigator.geolocation.getCurrentPosition(
    position => {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = Math.max(1, Math.round(position.coords.accuracy));
      const point = latLonToPercent(latitude, longitude);
      const nearest = getNearestFacilities(latitude, longitude, 3);

      renderHomeMarker(point.x, point.y);
      renderNearestFacilities(nearest);
      setCurrentSelection(point, nearest, '現在地');
      focusOnPoints([point, ...nearest.map(f => ({ x: f.mapX, y: f.mapY }))]);

      statusEl.textContent =
        `現在地から近い3施設を表示しました（位置精度の目安 ±${accuracy}m）。`;
      currentLocationButton.disabled = false;
    },
    error => {
      if (error.code === 1) {
        statusEl.textContent =
          '現在地の利用が許可されていません。ブラウザまたは端末の位置情報設定をご確認ください。';
      } else if (error.code === 2) {
        statusEl.textContent =
          '現在地を取得できませんでした。通信環境や位置情報設定をご確認ください。';
      } else if (error.code === 3) {
        statusEl.textContent =
          '現在地の取得に時間がかかりすぎました。もう一度お試しください。';
      } else {
        statusEl.textContent = '現在地を取得できませんでした。';
      }
      currentLocationButton.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
});

placeHomeButton.addEventListener('click', () => { placementMode=!placementMode; mapViewport.classList.toggle('placement-mode', placementMode); placementHint.hidden=!placementMode; placeHomeButton.textContent=placementMode ? '位置指定を中止' : '地図上で仮位置を指定'; statusEl.textContent=placementMode ? '地図上の自宅付近をタップしてください。' : '位置指定を中止しました。'; });
printButton.addEventListener('click', () => {
  if(!currentSelection){ statusEl.textContent='先に住所・現在地・地図上の位置のいずれかを指定してください。'; return; }
  if(!printImageReady){ statusEl.textContent='印刷用地図を準備しています。少し待ってからもう一度押してください。'; return; }
  window.print();
});
zoomInButton.addEventListener('click', () => changeZoom(1.3)); zoomOutButton.addEventListener('click', () => changeZoom(1/1.3)); resetMapButton.addEventListener('click', resetMap);
mapViewport.addEventListener('pointerdown', event => { activePointers.set(event.pointerId, {x:event.clientX, y:event.clientY}); pointerMoved=false; mapViewport.setPointerCapture(event.pointerId); if(activePointers.size===2){ dragState=null; const pts=[...activePointers.values()]; pinchState={distance:Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y), scale:mapState.scale, x:mapState.x, y:mapState.y}; return; } if(!placementMode && mapState.scale>1){ dragState={pointerId:event.pointerId, startX:event.clientX, startY:event.clientY, originX:mapState.x, originY:mapState.y}; } });
mapViewport.addEventListener('pointermove', event => { if(!activePointers.has(event.pointerId)) return; const prev=activePointers.get(event.pointerId); if(Math.hypot(event.clientX-prev.x, event.clientY-prev.y)>3) pointerMoved=true; activePointers.set(event.pointerId, {x:event.clientX,y:event.clientY}); if(activePointers.size===2 && pinchState){ const pts=[...activePointers.values()]; const distance=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y); if(!pinchState.distance) return; const centerClientX=(pts[0].x+pts[1].x)/2, centerClientY=(pts[0].y+pts[1].y)/2; const rect=mapViewport.getBoundingClientRect(); const centerX=centerClientX-rect.left-baseStage.left, centerY=centerClientY-rect.top-baseStage.top; const nextScale=Math.min(6,Math.max(1,pinchState.scale*distance/pinchState.distance)); const ratio=nextScale/pinchState.scale; mapState.scale=nextScale; mapState.x=centerX-(centerX-mapState.x)*ratio; mapState.y=centerY-(centerY-mapState.y)*ratio; applyMapTransform(); return; } if(dragState && dragState.pointerId===event.pointerId){ mapState.x=dragState.originX + event.clientX - dragState.startX; mapState.y=dragState.originY + event.clientY - dragState.startY; applyMapTransform(); } });
function endPointer(event) { const wasPlacement = placementMode && !pointerMoved && activePointers.size===1; activePointers.delete(event.pointerId); dragState=null; if(activePointers.size<2) pinchState=null; if(wasPlacement) setHomeFromMap(event.clientX,event.clientY); }
mapViewport.addEventListener('pointerup', endPointer); mapViewport.addEventListener('pointercancel', endPointer); mapViewport.addEventListener('wheel', event => { event.preventDefault(); const rect=mapViewport.getBoundingClientRect(); changeZoom(event.deltaY<0?1.12:0.9, event.clientX-rect.left, event.clientY-rect.top); }, {passive:false});
window.addEventListener('resize', layoutMapStage);
layoutMapStage(); renderFacilityMarkers(); resetMap();
printButton.disabled=false;
</script>
